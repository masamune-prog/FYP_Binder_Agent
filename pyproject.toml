[project]
name = "protein-candidate-agent"
version = "0.1.0"
description = "Smolagents protein candidate design agent with Plan-Execute-Verify loop"
requires-python = ">=3.10"
dependencies = [
    "smolagents>=1.0.0",
    "litellm",
    "biopython",
    "requests",
    "pandas",
]

[project.optional-dependencies]
structural = [
    "colabfold[alphafold]",
    "protenix",
]
# ESM2 expression metric filter (Hugging Face transformers)
esm = [
    "transformers",
    "torch",
]
# Rosetta ΔSASA docking filter (requires free academic licence)
# Install manually: pip install pyrosetta-installer &&
#   python -c "import pyrosetta_installer; pyrosetta_installer.install_pyrosetta()"
rosetta = []

[project.scripts]
protein-agent = "main:main"

